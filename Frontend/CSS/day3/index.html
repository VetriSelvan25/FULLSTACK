<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <style>

        /* 1. Universal Selector */
        * {
            background-color: lightgray;
            color: black;
        }

        /* 2. Element Selector */
        h1 {
            color: darkblue;
        }

        /* 3. Class Selector */
        .student {
            background-color: white;
            color: green;
        }

        /* 4. ID Selector */
        #skills {
            background-color: lightyellow;
            color: red;
        }

        /* 5. Grouping Selector */
        h2, p {
            color: brown;
        }

    </style>
</head>

<body>

    <h1>Student Details</h1>

    <h2>Personal Information</h2>

    <p class="student">Student Name: Vetri Selvan</p>
    <p class="student">Course Name: Full Stack Development</p>

    <h2>College Information</h2>

    <p class="student">College Name: Kongunadu College</p>
    <p id="skills">Skills:  <br>
       
        HTML  <br>
         CSS  <br>
          JavaScript</p>

</body>
</html>
