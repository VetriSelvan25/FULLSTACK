<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Day-5</title>
    </head>
    <body>
       <header><h1>Student Registration Form.</h1></header>
        
        <main>
            <form>
        <section>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>
        <label for="email" >Email</label>
        <input type="email" id ="email" name = "email" placeholder="Enter your email"><br><br>
        <label for ="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>
        <label for ="age">Age</label>
        <input type="number" id="age" name="age" placeholder="Enter your age"><br><br>
        <label for=""dob">Date of Birth</label>
        <input type="date" id="dob" name="dob"><br><br>
        <label for="gender">Gender
        <input type="radio" id=""male" name = "gender" value ="male">Male
        <input type="radio" id="female" name="gender" value="female">Female <br><br>
        <label for="Course">Course</label>
        <select id ="Course" name="Course">
            <option value="Full Stack">Full Stack</option>
            <option value="Java">Java</option>
            <option value="Python">Python</option>
            <option value="C#">C#</option>
        </select><br><br>
        <label for=""Skills">Skills</label>    
        <input type="checkbox" id="html" name="Skills" value="HTML">HTML
        <input type="checkbox" id="css" name="Skills" value="CSS">CSS
        <input type="checkbox" id="javascript" name="Skills" value="JavaScript">JavaScript
        <input type="checkbox" id="python" name="Skills" value="Python">Python
        <br><br>
        <label for="address">Address</label>
        <textarea id="address" name="address" placeholder="Enter your address"></textarea>
        <br><br>
        <label for ="submit">Submit</label>
        <input type="submit" value="Submit">
        <br><br>
        <label for="reset">Reset</label>
        <input type="reset" value="Reset">
        <br><br>
        </section>
        </form>
        </main>

</html>
